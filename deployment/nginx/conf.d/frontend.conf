# Frontend Admin Panel Configuration
upstream frontend_app {
    server frontend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name panel.soulyousee.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.soulyousee.com;

    # SSL Configuration - CloudFlare Origin Certificate
    ssl_certificate /etc/nginx/certs/soulyousee.com;
    ssl_certificate_key /etc/nginx/certs/soulyousee.com.private;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers (CSP frame-ancestors allows embedding in Google Sites)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://sites.google.com https://*.google.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Application routes
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://frontend_app;
    }

    # Health check
    location /health {
        proxy_pass http://frontend_app;
        access_log off;
    }
}

