name: Reset Database

on:
  # Allow manual trigger from GitHub UI only (for safety)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - production
        default: 'development'
      confirm:
        description: 'Type "RESET" to confirm database reset (THIS WILL DELETE ALL DATA)'
        required: true
        default: 'no'

jobs:
  reset-database:
    name: Reset Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation
        id: validate
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RESET" ]; then
            echo "❌ Database reset cancelled. You must type 'RESET' in the confirmation field."
            exit 1
          fi
          echo "✅ Confirmation received. Proceeding with database reset..."
          echo "⚠️  WARNING: This will DELETE ALL DATA in the database!"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.environment == 'production' && 'main' || 'development' }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Check container status
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Checking if backend container is running..."
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            if docker ps | grep -q burangrang-backend; then
              echo "✅ Backend container is running"
              docker ps | grep burangrang-backend
            else
              echo "❌ Backend container is not running!"
              echo "Please ensure the backend is deployed before resetting the database."
              exit 1
            fi
          ENDSSH

      - name: Reset database
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            set -e
            
            echo "==================================="
            echo "🗄️  Starting Database Reset"
            echo "Environment: $ENVIRONMENT"
            echo "==================================="
            echo ""
            echo "⚠️  WARNING: This operation will:"
            echo "   - Drop the entire database"
            echo "   - Delete ALL data"
            echo "   - Recreate the database"
            echo "   - Apply all migrations"
            echo "   - Run Prisma generate and seed explicitly"
            echo ""
            
            # Check if container is running
            if ! docker ps | grep -q burangrang-backend; then
              echo "❌ Backend container is not running!"
              exit 1
            fi
            
            echo "📋 Current database status:"
            docker exec -w /app burangrang-backend npx prisma migrate status || echo "⚠️  Could not check migration status"
            
            echo ""
            echo "🔄 Resetting database..."
            echo "Running: npx prisma migrate reset --force --skip-generate --skip-seed"
            
            # Run the reset command (from backend app root /app)
            # --force: Skip the confirmation prompt (required for CI/CD)
            # --skip-generate: avoid Prisma Client write permission issues in production container
            # --skip-seed: avoid runtime ts-node seed dependency/tsconfig mismatch in container
            docker exec -w /app burangrang-backend npx prisma migrate reset --force --skip-generate --skip-seed

            echo ""
            echo "🔧 Generating Prisma Client..."
            echo "Running: npx prisma generate --schema=./prisma/schema.prisma"
            # Run as root to allow writing to /app/node_modules/.prisma inside production container
            docker exec -u 0 -w /app burangrang-backend npx prisma generate --schema=./prisma/schema.prisma

            echo ""
            echo "🌱 Running database seed..."
            echo "Running: npx ts-node --transpile-only prisma/seed.ts (with TS_NODE_COMPILER_OPTIONS)"
            # Force commonjs/node so ts-node in container does not require NodeNext (TS5109)
            docker exec -w /app -e TS_NODE_COMPILER_OPTIONS='{"module":"commonjs","moduleResolution":"node"}' burangrang-backend npx ts-node --transpile-only prisma/seed.ts
            
            echo ""
            echo "✅ Database reset completed successfully!"
            echo "==================================="
          ENDSSH

      - name: Verify database reset
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Verifying database reset..."
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            echo "📋 Migration status after reset:"
            docker exec -w /app burangrang-backend npx prisma migrate status
            
            echo ""
            echo "🔍 Verifying Prisma Client artifacts:"
            docker exec -w /app burangrang-backend ls -la /app/node_modules/.prisma/client >/dev/null && echo "✅ Prisma Client generated"
            
            echo ""
            echo "✅ Database reset verification completed!"
          ENDSSH

      - name: Create reset summary
        if: always()
        run: |
          echo "## 🗄️  Database Reset Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ github.event.inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Database reset completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**What happened:**" >> $GITHUB_STEP_SUMMARY
            echo "- Database was dropped and recreated" >> $GITHUB_STEP_SUMMARY
            echo "- All migrations were applied" >> $GITHUB_STEP_SUMMARY
            echo "- Prisma Client was generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "- Seed script was executed successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️  **Important:** All previous data has been deleted!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Database reset failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Troubleshooting:**" >> $GITHUB_STEP_SUMMARY
            echo "- Verify backend container is running" >> $GITHUB_STEP_SUMMARY
            echo "- Check database connection" >> $GITHUB_STEP_SUMMARY
            echo "- Review Prisma schema for errors" >> $GITHUB_STEP_SUMMARY
            echo "- Check migration files for issues" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify reset status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Database reset completed successfully!"
            echo "⚠️  All previous data has been deleted!"
          else
            echo "❌ Database reset failed!"
            echo "Please check the logs above for details."
          fi
