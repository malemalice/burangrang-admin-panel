name: Deploy Frontend to Production

on:
  push:
    tags:
      - 'frontend-v*.*.*'  # Triggers on frontend version tags like frontend-v1.0.0
      - 'panel-v*.*.*'     # Alternative: panel-specific tags

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        default: 'latest'

jobs:
  deploy:
    name: Deploy Frontend to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          
      - name: Checkout code (for verification only)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_tag.outputs.tag }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOYMENT_PATH: ${{ secrets.DEPLOYMENT_PATH }}
          WEBAPP_PATH: ${{ secrets.WEBAPP_PATH }}
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            set -e
            
            echo "==================================="
            echo "🚀 Starting Frontend deployment"
            echo "Tag: $TAG"
            echo "==================================="
            
            # Navigate to webapp repository
            cd $WEBAPP_PATH
            
            echo "📥 Fetching latest changes..."
            git fetch --all --tags
            
            echo "🔄 Checking out tag: $TAG"
            git checkout $TAG
            
            echo "📦 Pulling latest changes..."
            git pull origin $TAG || true
            
            # Navigate to deployment directory
            cd $DEPLOYMENT_PATH
            
            echo "🛑 Stopping frontend container..."
            docker compose stop frontend || true
            
            echo "🗑️  Removing old frontend container..."
            docker compose rm -f frontend || true
            
            echo "🏗️  Building frontend image on VPS..."
            docker compose build --no-cache frontend
            
            echo "🚀 Starting frontend container..."
            docker compose up -d frontend
            
            echo "⏳ Waiting for container to be healthy..."
            sleep 10
            
            echo "🔍 Checking container status..."
            docker compose ps frontend
            
            echo "📋 Recent container logs:"
            docker compose logs --tail=50 frontend
            
            echo "✅ Frontend deployment completed!"
            echo "==================================="
          ENDSSH

      - name: Verify deployment
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Waiting 30 seconds for application to fully start..."
          sleep 30
          
          echo "Checking if frontend is responding..."
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            # Check if container is running
            if docker ps | grep -q soulyousee-frontend; then
              echo "✅ Container is running"
              
              # Check container health
              health=\$(docker inspect --format='{{.State.Health.Status}}' soulyousee-frontend 2>/dev/null || echo "no-health-check")
              echo "Health status: \$health"
              
              # Try to curl the application
              if docker exec soulyousee-frontend curl -f http://localhost:8080/ >/dev/null 2>&1; then
                echo "✅ Application is responding"
              else
                echo "⚠️  Application might not be ready yet, but container is running"
              fi
            else
              echo "❌ Container is not running!"
              exit 1
            fi
          ENDSSH

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
            echo "🌐 Frontend Admin Panel is now live at https://panel.soulyousee.com"
          else
            echo "❌ Deployment failed!"
            echo "Please check the logs above for details."
          fi

      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.get_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **Live URL:** https://panel.soulyousee.com" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment failed. Please check the logs." >> $GITHUB_STEP_SUMMARY
          fi

