name: Run Database Migrations (Production)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or ref to run migrations from (leave empty to use workflow ref)'
        required: false
        type: string
        default: ''
      confirm:
        description: 'Type "yes" to confirm running migrations on PRODUCTION'
        required: true
        default: 'no'

jobs:
  run-migrations:
    name: Run Database Migrations (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "❌ Migration cancelled. You must type 'yes' in the confirmation field."
            exit 1
          fi
          echo "✅ Confirmation received. Proceeding with production migrations..."

      - name: Determine branch/ref to use
        id: branch
        run: |
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "branch=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Check container status
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Checking if production backend container is running..."
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            if docker ps | grep -q burangrang-prod-backend; then
              echo "✅ Production backend container is running"
              docker ps | grep burangrang-prod-backend
            else
              echo "❌ Production backend container is not running!"
              echo "Please ensure the production backend is deployed before running migrations."
              exit 1
            fi
          ENDSSH

      - name: Extract branch name from ref
        id: branch_name
        run: |
          BRANCH_REF="${{ steps.branch.outputs.branch }}"
          if [[ "$BRANCH_REF" == refs/heads/* ]]; then
            BRANCH_NAME="${BRANCH_REF#refs/heads/}"
          else
            BRANCH_NAME="$BRANCH_REF"
          fi
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Branch name extracted: $BRANCH_NAME"

      - name: Pull selected branch on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH_PRODUCTION }}
          BRANCH_NAME: ${{ steps.branch_name.outputs.branch_name }}
        run: |
          echo "📥 Pulling latest code from branch: $BRANCH_NAME"
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            set -e

            if [ -z "$PROJECT_PATH" ]; then
              echo "⚠️  PROJECT_PATH_PRODUCTION secret not set. Skipping code pull."
              exit 0
            fi

            cd $PROJECT_PATH || {
              echo "❌ Failed to navigate to project path: $PROJECT_PATH"
              exit 0
            }

            git fetch origin "$BRANCH_NAME" || git fetch origin || true
            git checkout "$BRANCH_NAME" || true
            git pull origin "$BRANCH_NAME" || true

            echo "📋 Current commit: $(git log -1 --oneline)"
            echo "✅ Latest code pulled successfully!"
          ENDSSH

      - name: Run database migrations
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            set -e

            echo "==================================="
            echo "🗄️  Starting Database Migrations (Production)"
            echo "Using: npx prisma migrate deploy"
            echo "==================================="

            if ! docker ps | grep -q burangrang-prod-backend; then
              echo "❌ Production backend container is not running!"
              exit 1
            fi

            echo "📋 Current migration status:"
            docker exec burangrang-prod-backend npx prisma migrate status || echo "⚠️  Could not check migration status"

            echo ""
            echo "🚀 Running migrations..."
            docker exec burangrang-prod-backend npx prisma migrate deploy

            echo ""
            echo "✅ Migrations completed successfully!"
            echo "==================================="
          ENDSSH

      - name: Verify migrations
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            echo "📋 Final migration status:"
            docker exec burangrang-prod-backend npx prisma migrate status
          ENDSSH

      - name: Create migration summary
        if: always()
        run: |
          echo "## 🗄️  Production Database Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch/Ref:** \`${{ steps.branch.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Migrations completed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Migration failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
